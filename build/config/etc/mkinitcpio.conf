# vim:set ft=sh
# Ronin - initramfs universal para dos máquinas.
# Sin hook `autodetect`: evita recortar módulos de la segunda máquina.
# Sin hook `kms`: los drivers están en MODULES y no atamos el initramfs a una GPU.

MODULES=(btrfs usb_storage uas nvme xhci_pci ahci
         virtio_blk virtio_pci virtio_net
         amdgpu i915 xe nouveau)

BINARIES=()
FILES=()

HOOKS=(base udev modconf keyboard block filesystems fsck)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0)
