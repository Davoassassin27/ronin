# Ronin - configuración de hw-adapt
# Este archivo se instala con el usuario del build sustituido.

HW_ADAPT_USER="@TARGET_USER@"

# Escribir monitor=,preferred,auto,1 en hardware-auto.conf.
WRITE_MONITOR_CONFIG="1"

# Solo exportar HSA_OVERRIDE_GFX_VERSION si se define explícitamente.
# Ejemplo para una iGPU no soportada por ROCm: "10.3.0"
AMD_GFX_VERSION=""

# Perfil power-saver si la batería está por debajo de 15 % y sin AC.
LOW_BATTERY_POWERSAVER="1"

# Limpiar estados de Bluetooth/ALSA cuando cambia la placa.
CLEAN_ON_BOARD_CHANGE="1"

# Reiniciar NetworkManager al cambiar de placa. Puede cortar SSH; off por defecto.
RESTART_NETWORK_ON_BOARD_CHANGE="0"
